function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open("C2MMVP_TEST_FICTIFS_V8",1);
    req.onupgradeneeded=()=>{
      const d=req.result;
      if(!d.objectStoreNames.contains("students")) d.createObjectStore("students",{keyPath:"id"});
      if(!d.objectStoreNames.contains("evaluations")){
        const st=d.createObjectStore("evaluations",{keyPath:"id",autoIncrement:true});
        st.createIndex("studentId","studentId",{unique:false});
      }
    };
    req.onsuccess=()=>{db=req.result;resolve(db)};
    req.onerror=()=>reject(req.error);
  });
}
function tx(store,mode="readonly"){
  return db.transaction(store,mode).objectStore(store);
}
function getAll(store){
  return new Promise((resolve,reject)=>{
    const r=tx(store).getAll(); r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
  });
}
function put(store,obj){
  return new Promise((resolve,reject)=>{
    const r=tx(store,"readwrite").put(obj); r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
  });
}
function clearStore(store){
  return new Promise((resolve,reject)=>{
    const r=tx(store,"readwrite").clear(); r.onsuccess=()=>resolve(); r.onerror=()=>reject(r.error);
  });
}
async function loadData(){
  await openDB();
  let stored=await getAll("students");
  if(!stored.length){
    for(const s of DEFAULT_STUDENTS) await put("students",s);
    stored=DEFAULT_STUDENTS.slice();
  }
  students=stored.map(s=>({...s,evaluations:[]}));
  const evals=await getAll("evaluations");
  evals.forEach(e=>{
    const s=students.find(x=>x.id===e.studentId);
    if(s) s.evaluations.push({...e});
  });
  students.forEach(s=>s.evaluations.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)));
  ready=true;
  render();
}
async function persistEvaluation(e){
  await put("evaluations",e);
}
function resetAllData(){
  if(!confirm("Supprimer toutes les évaluations fictives et revenir aux élèves de démonstration ?")) return;
  clearStore("evaluations").then(()=>loadData());

function toISODateValue(v){
  if(!v) return "";
  const m=String(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return `${m[3]}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;
  const m2=String(v).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m2) return `${m2[1]}-${String(m2[2]).padStart(2,"0")}-${String(m2[3]).padStart(2,"0")}`;
  return "";
}
function displayDateValue(v){
  if(!v) return "";
  const m=String(v).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return `${String(m[3]).padStart(2,"0")}/${String(m[2]).padStart(2,"0")}/${m[1]}`;
  return v;
}

function renderCompetence(id){
const c=competencies.find(x=>x.id===id);
if(!c)return "";
const grouped=c.criteria.some(x=>typeof x==="object"&&x.group);
const groups={};
if(grouped)c.criteria.forEach((cr,i)=>(groups[cr.group]??=[]).push({...cr,i}));
const content=grouped
 ? Object.entries(groups).map(([g,items])=>`
   <div class="c11-group">
     <div class="c11-group-title">${g} — ${esc(items[0].label)}</div>
     ${items.map(cr=>{
       const key=id+"-"+cr.i,val=draft.levels[key]||"";

         <label>Observation</label><textarea placeholder="Observation éventuelle..." onchange="draft.obs['${key}']=this.value">${esc(draft.obs[key]||"")}</textarea>
       </div>`;
     }).join("")}
   </div>`).join("")
 : c.criteria.map((cr,i)=>{
    const key=id+"-"+i,val=draft.levels[key]||"";
    return `<div class="crit"><b>${i+1}. ${esc(cr.text||cr)}</b>
      <div class="levels">${["Non observé","À renforcer","Maîtrisé","Autonome"].map(v=>`<button class="level ${val===v?"sel":""}" onclick="setLevel('${key}','${v}')">${v}</button>`).join("")}</div>

    </div>`;
  }).join("");
return `<div class="panel competence">
  <div class="row"><div><h2>${c.id} — ${esc(c.name)}</h2>${c.activity?`<div class="muted">${esc(c.activity)}</div>`:""}${c.level?`<div class="pill" style="margin-top:6px">${esc(c.level)}</div>`:""}</div><span class="pill">${c.criteria.length} critères</span></div>
  ${content}
</div>`;
}

function summary(){
const lines=draft.comps.map(id=>{
const c=competencies.find(x=>x.id===id);
const n=c.criteria.filter((_,i)=>draft.levels[id+"-"+i]).length;
return `${id} : ${n}/${c.criteria.length} critère(s) positionné(s)`;
}).join(" · ");

 ? `<br><b>${draft.targetStudents.length}</b> élève(s) recevront cette même évaluation.`
 : "";
return `<div class="notice"><b>Vérification avant enregistrement</b><br>${lines}${targetInfo}<br><span class="muted">Les critères non renseignés resteront sans positionnement.</span></div>`;
}
async function saveEvaluation(){
if(!draft.title.trim()){alert("Saisis un intitulé de situation.");return;}
if(!draft.comps.length){alert("Sélectionne au moins une compétence.");return;}

if(draft.editId){
  const editId=String(draft.editId);
  const existingStudent=sortStudentsAlpha(students).find(s=>
    s.evaluations.some(x=>String(x.id)===editId)
  );
  const existing=existingStudent?.evaluations.find(x=>String(x.id)===editId);
  if(!existing){alert("Évaluation introuvable.");return;}

  // IMPORTANT : update the same record, preserving its id, creation date and batch.
  const updated={
    ...existing,
    id:existing.id,
    date:draft.date,
    title:draft.title.trim(),
    place:draft.place,
    type:draft.type,
    comps:[...draft.comps],
    levels:{...draft.levels},
    obs:{...draft.obs},
    studentId:existing.studentId
  };

  try{
    await persistEvaluation(updated);

    // Update the in-memory record instead of pushing a new evaluation.
    const owner=students.find(st=>st.id===existing.studentId);
    if(owner){
      const idx=owner.evaluations.findIndex(x=>String(x.id)===editId);
      if(idx>=0) owner.evaluations[idx]={...updated};
    }

    draft=null;
    selectedStudent=existing.studentId;
    alert("L’évaluation a été modifiée et enregistrée.");
    go("history");
  }catch(err){
    alert("Erreur d’enregistrement : "+err);
  }
  return;
}

const targets = draft.mode==="collective" ? [...draft.targetStudents] : [selectedStudent];

function evaluationScore20(e){
  const vals=[];
  e.comps.forEach(cid=>{
    const c=competencies.find(x=>x.id===cid);
    if(!c)return;
    c.criteria.forEach((_,i)=>{
      const v=e.levels[cid+"-"+i];
      if(v && v!=="Non observé") vals.push(levelScore(v));
    });
  });
  if(!vals.length)return null;
  return Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*5*10)/10;
}
function evaluationScoreLabel(e){
  const n=evaluationScore20(e);
  return n===null?"Non notée":n.toFixed(1).replace(".",",")+" / 20";
}
function scoreClass(n){
  if(n===null)return "";
  if(n<8)return "score-red";
  if(n<10)return "score-orange";
  if(n<14)return "score-yellow";
  return "score-green";
}

function levelScore(v){
  return {"Non observé":0,"À renforcer":1,"En cours":2,"Maîtrisé":3,"Autonome":4}[v] ?? 0;
}
function latestCompetenceScore(s,c){
  const es=s.evaluations.filter(e=>e.comps.includes(c.id));
  const last=es.at(-1);
  if(!last) return null;
  const vals=c.criteria.map((_,i)=>levelScore(last.levels[c.id+"-"+i])).filter(x=>x>0);
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
}
function drawRadar(){
  const canvas=document.getElementById("radar");
  if(!canvas)return;
  const s=student(), dpr=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr; canvas.height=rect.height*dpr;
  const ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr);
  const w=rect.width,h=rect.height,cx=w/2,cy=h/2+10,r=Math.min(w,h)*.34,n=competencies.length;
  ctx.clearRect(0,0,w,h);
  ctx.font="12px Arial"; ctx.textAlign="center"; ctx.textBaseline="middle";
  for(let ring=1;ring<=4;ring++){
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const a=-Math.PI/2+i*2*Math.PI/n,x=cx+Math.cos(a)*r*ring/4,y=cy+Math.sin(a)*r*ring/4;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.closePath();ctx.strokeStyle="#d9dee7";ctx.stroke();
  }
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+i*2*Math.PI/n,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);ctx.strokeStyle="#e4e7ec";ctx.stroke();
    const lx=cx+Math.cos(a)*(r+28),ly=cy+Math.sin(a)*(r+28);
    ctx.fillStyle="#344054";ctx.fillText(competencies[i].id,lx,ly);
  }
  const pts=[];
  competencies.forEach((c,i)=>{
    const v=latestCompetenceScore(s,c);
    const score=v===null?0:v;
    const a=-Math.PI/2+i*2*Math.PI/n;
    pts.push([cx+Math.cos(a)*r*score/4,cy+Math.sin(a)*r*score/4]);
  });
  if(pts.some((_,i)=>latestCompetenceScore(s,competencies[i])!==null)){
    ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();
    ctx.fillStyle="rgba(36,99,235,.14)";ctx.fill();ctx.strokeStyle="#2463eb";ctx.lineWidth=2;ctx.stroke();
    pts.forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],4,0,Math.PI*2);ctx.fillStyle="#2463eb";ctx.fill();});
  }
  ctx.fillStyle="#667085";ctx.font="11px Arial";
  ctx.fillText("4 — Autonome",cx,cy-r-15);
  ctx.fillText("0 — Non observé",cx,cy+r+15);
}

    const score=latestCompetenceScore(s,c);
    const v=score===null?0:score;
    const a=-Math.PI/2+i*2*Math.PI/n;
    pts.push([cx+Math.cos(a)*r*v/4,cy+Math.sin(a)*r*v/4]);
  });
  if(s.evaluations.length){
    ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();
    ctx.fillStyle="rgba(36,99,235,.14)";ctx.fill();ctx.strokeStyle="#2463eb";ctx.lineWidth=2;ctx.stroke();
    pts.forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],4,0,Math.PI*2);ctx.fillStyle="#2463eb";ctx.fill();});
  }
  ctx.fillStyle="#667085";ctx.font="11px Arial";
  ctx.fillText("4 — Autonome",cx,cy-r-15);ctx.fillText("0 — Non observé",cx,cy+r+15);
}
window.addEventListener("resize",()=>{if(page==="position")drawPositionRadar()});


function reportLevel(score){
  if(score===null)return {label:"Non observée",pct:0};
  const pct=Math.round(score/4*100);
  let label="À renforcer";
  if(score>=3.5)label="Maîtrisé / autonome";
  else if(score>=2.5)label="À consolider";
  else if(score>=1.5)label="En cours";
  return {label,pct};
}
function reportPage(){
  setActive("report");
  const s=student();
  const allScores=competencies.map(c=>latestCompetenceScore(s,c)).filter(v=>v!==null);
  const overall=allScores.length?Math.round(allScores.reduce((a,b)=>a+b,0)/allScores.length/4*100):0;
  const notes=s.evaluations.map(e=>evaluationScore20(e)).filter(v=>v!==null);
  const avgNote=notes.length?(notes.reduce((a,b)=>a+b,0)/notes.length).toFixed(1).replace(".",","):"—";
  const last=s.evaluations.at(-1);

  document.getElementById("main").innerHTML=`
  <div class="report-page">
    <div class="report-actions">
      <button class="secondary" onclick="go('history')">← Retour</button>
      <button class="primary" onclick="window.print()">🖨️ Imprimer / PDF</button>
    </div>
    <div class="report-header">
      <h1>Bilan de progression des compétences</h1>
      <p><b>${esc(s.name)}</b> — Classe C2MMVP / 2CAP2</p>
      <p>Maintenance des véhicules — document de synthèse pour l'élève</p>
      <p>Dernière mise à jour : ${last?esc(last.date):"aucune évaluation"}</p>
    </div>

    <div class="report-summary">
      <div class="report-kpi"><div class="muted">Positionnement global</div><div class="value">${allScores.length?overall+" %":"—"}</div><div class="muted">sur les compétences observées</div></div>
      <div class="report-kpi"><div class="muted">Moyenne des évaluations</div><div class="value">${avgNote}${avgNote!=="—"?" / 20":""}</div><div class="muted">${s.evaluations.length} évaluation(s)</div></div>
      <div class="report-kpi"><div class="muted">Compétences observées</div><div class="value">${allScores.length} / 9</div><div class="muted">C1.1 à C2.5</div></div>
    </div>

    <div class="report-section">
      <h2>Mon positionnement</h2>
      <p class="muted">La barre montre où tu te situes actuellement. Plus le curseur va vers le vert, plus les critères observés sont maîtrisés.</p>
      ${competencies.map(c=>{
        const r=reportLevel(latestCompetenceScore(s,c));
        return `<div class="report-competence">
          <div class="report-title">${c.id} — ${esc(c.name)}</div>
          <div class="report-bar"><div class="report-marker" style="left:${r.pct}%"></div></div>
          <div class="report-meta"><span>🔴 À renforcer</span><span>🟠 En cours</span><span>🟡 À consolider</span><span>🟢 Maîtrisé / autonome</span></div>
          <div class="report-meta"><span>${r.label}</span><b>${r.pct}%</b></div>
        </div>`;
      }).join("")}
    </div>

    <div class="report-section">
      <h2>Mes évaluations</h2>
      ${s.evaluations.length?s.evaluations.slice().reverse().map(e=>`
        <div class="report-eval">
          <b>${esc(e.date)}</b>
          <div><b>${esc(e.title)}</b><br><span class="muted">${e.comps.map(competenceLabel).join("<br>")}</span></div>
          <div class="report-note">${evaluationScoreLabel(e)}</div>
        </div>`).join(""):'<p class="muted">Aucune évaluation enregistrée.</p>'}
    </div>

    <div class="report-section">
      <h2>À retenir</h2>
      <div class="report-advice">
        <b>Ce que je maîtrise :</b>
        ${(() => {
          const good=competencies.filter(c=>{const v=latestCompetenceScore(s,c);return v!==null&&v>=3.5}).map(c=>competenceLabel(c.id));
          return good.length?good.join(", "):"pas encore suffisamment de données";
        })()}<br><br>
        <b>Ce que je dois encore travailler :</b>
        ${(() => {
          const work=competencies.filter(c=>{const v=latestCompetenceScore(s,c);return v!==null&&v<2.5}).map(c=>competenceLabel(c.id));
          return work.length?work.join(", "):"aucune compétence prioritaire identifiée";
        })()}
      </div>
      <p class="muted" style="margin-bottom:0">Ce document est une synthèse pédagogique du suivi des compétences. Il ne remplace pas les documents officiels de certification.</p>
    </div>

    <div class="report-section">
      <div class="grid2">
        <div><b>Élève</b><br><br>Signature : __________________________</div>
        <div><b>Enseignant</b><br><br>Signature : __________________________</div>
      </div>
    </div>
  </div>`;
}



function competenceActivities(c){
  if(!c.activities || !c.activities.length) return "";
  return `<div class="competence-activities"><strong>Principales activités mettant en oeuvre la compétence</strong><ul>${c.activities.map(a=>`<li>${esc(a)}</li>`).join("")}</ul></div>`;
}

function renderCriteriaForCompetence(c,draft){
  if(!c.criteria.some(x=>typeof x==="object"&&x.group)){
    return c.criteria.map((crit,i)=>{
      const key=c.id+"-"+i, val=draft.levels[key]||"Non observé";
      return `<div class="criterion"><div class="criterion-text">${esc(crit.text||crit)}</div>
        <div class="levels">${["À renforcer","En cours","À consolider","Maîtrisé"].map(v=>`<button class="${val===v?"selected ":""}level-${levelScore(v)}" onclick="setLevel('${key}','${v}')">${v}</button>`).join("")}</div></div>`;
    }).join("");
  }
  const groups={};
  c.criteria.forEach((crit,i)=>(groups[crit.group]??=[]).push({...crit,i}));
  return Object.entries(groups).map(([g,items])=>`
    <div class="c11-group">
      <div class="c11-group-title">${g} — ${esc(items[0].label)}</div>
      ${items.map(crit=>{
        const key=c.id+"-"+crit.i, val=draft.levels[key]||"Non observé";
        return `<div class="c11-criterion">
          <div class="c11-criterion-text"><b>${crit.i+1}.</b> ${esc(crit.text)}</div>
          <div class="levels">${["À renforcer","En cours","À consolider","Maîtrisé"].map(v=>`<button class="${val===v?"selected ":""}level-${levelScore(v)}" onclick="setLevel('${key}','${v}')">${v}</button>`).join("")}</div>
        </div>`;
      }).join("")}
    </div>`).join("");
}

function compsPage(){
setActive("comps");
document.getElementById("main").innerHTML=`<h1>Référentiel</h1><div class="sub">Compétences et critères structurés selon le référentiel CAP Maintenance des véhicules</div><div class="ref-source-note">Les familles de critères et leurs sous-critères sont affichés selon l’architecture du référentiel. Aucun critère supplémentaire n’est ajouté.</div>
${competencies.map(c=>{
  const groups={};
  if(c.criteria.some(x=>typeof x==="object"&&x.group)) c.criteria.forEach((x,i)=>(groups[x.group]??=[]).push({...x,i}));
  const body=Object.keys(groups).length
    ? Object.entries(groups).map(([g,items])=>`<div class="c11-group"><div class="c11-group-title">${g} — ${esc(items[0].label)}</div><ol>${items.map(x=>`<li>${esc(x.text)}</li>`).join("")}</ol></div>`).join("")
    : `<ol>${c.criteria.map(x=>`<li>${esc(x.text||x)}</li>`).join("")}</ol>`;
  const acts = c.activities || (c.activity ? [c.activity] : []);
const actTitle = acts.length > 1
  ? "Principales activités mettant en oeuvre la compétence"
  : "Principale activité mettant en oeuvre la compétence";
const activityBlock = acts.length ? `<div class="competence-activities">
  <div class="competence-activities-title"><strong>${actTitle}</strong></div>
  ${acts.map(a=>`<div class="competence-activity">${esc(a)}</div>`).join("")}
</div>` : "";
return `<div class="panel competence"><h2>${c.id} — ${esc(c.name)}</h2>
${activityBlock}
${c.level?`<div class="pill" style="margin-top:6px">${esc(c.level)}</div>`:""}<details><summary>Afficher les critères</summary>${body}</details></div>`;
}).join("")}`;
}
loadData().catch(err=>{document.getElementById("main").innerHTML=`<div class="panel"><h2>Erreur de base de données</h2><p>${esc(err.message||err)}</p></div>`;});
