<template id="settings-page-template">
  <div class="page-header">
    <div><h1>Paramètres</h1><p>Administration des élèves, du référentiel et du code administrateur.</p></div>

  </div>
  <div class="settings-grid">
    <div class="settings-card">
      <h3>🏫 Informations de la classe</h3>
      <div class="form-grid">
        <label>Nom de la classe<input id="settings-class-name" type="text" placeholder="Ex. C2MMVP"></label>
        <label>Nom du professeur<input id="settings-teacher-name" type="text" placeholder="Nom et prénom"></label>

      <button type="button" class="primary" onclick="saveSchoolSettings()">Enregistrer</button>
    </div>
    <div class="settings-card">
      <h3>🔐 Code administrateur</h3><p>Le code protège l'accès à cette page.</p>
      <div class="form-grid">
        <label>Code actuel<input id="settings-current-code" type="password" autocomplete="current-password"></label>
        <label>Nouveau code<input id="settings-new-code" type="password" autocomplete="new-password"></label>
        <label>Confirmer le nouveau code<input id="settings-confirm-code" type="password" autocomplete="new-password"></label>
      </div>
      <button type="button" class="primary" onclick="changeAdminCode()">Modifier le code</button>
    </div>
    <div class="settings-card">
      <h3>👥 Élèves</h3>
      <div class="form-grid"><label>Nom et prénom<input id="settings-student-name" type="text" placeholder="Nom Prénom"></label></div>
      <button type="button" class="primary" onclick="addStudentFromSettings()">Ajouter un élève</button>
      <button type="button" class="secondary settings-danger" style="margin-top:10px" onclick="requestDeleteAllStudents()">🗑️ Supprimer la liste des élèves</button>
      <div class="settings-import-box">
        <strong>Importer une liste depuis Excel</strong>
        <p class="muted">Format : deux colonnes <b>Nom</b> et <b>Prénom</b>, une ligne par élève. Le modèle .xlsx est fourni avec le logiciel. Pour l'import hors ligne, importe directement le fichier <b>Excel (.xlsx)</b>.</p>
        <div class="settings-import-actions">
          <button type="button" class="secondary" onclick="downloadStudentTemplate()">📥 Télécharger le modèle Excel vierge</button>
          <label class="secondary" style="cursor:pointer">Choisir un fichier Excel
            <input type="file" accept=".xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" onchange="importStudentsFromExcelFile(this)" style="display:none">
          </label>
        </div>
      </div>
      <div id="settings-students-list" class="settings-list"></div>
    </div>
  </div>
  <div class="settings-card settings-section">
    <h3>📥 Importer un référentiel depuis un PDF</h3>
    <p class="referentiel-import-help">Sélectionne le PDF officiel du référentiel. Le logiciel extrait les blocs, compétences, activités, connaissances associées et critères d’évaluation, puis affiche obligatoirement un écran de vérification avant toute modification du référentiel enregistré.</p>
    <div class="referentiel-import-card">
      <strong>PDF du référentiel</strong>
      <div class="referentiel-import-actions">
        <label class="secondary referentiel-import-button" style="cursor:pointer">📄 Choisir le PDF
          <input type="file" accept="application/pdf,.pdf" onchange="importReferentielPdfFile(this)" style="display:none">
        </label>
        <button type="button" class="secondary" onclick="openReferentielTextImport()">📝 Coller le texte extrait</button>
      </div>
      <div class="referentiel-import-status">
        <b>Principe de sécurité :</b> aucun remplacement n’est effectué directement. Tu peux contrôler, modifier les codes/intitulés et choisir <b>Fusionner</b> ou <b>Remplacer</b> lors de l’étape finale.
      </div>
    </div>
  </div>

    <div id="settings-competencies-list"></div>
  </div>

<script>
async function resetFictitiousDemoData(){
  if(!confirm("Réinitialiser les données de démonstration avec les 10 élèves fictifs ?")) return;
  try{
    const dbs = await indexedDB.databases();
    for(const d of dbs){
      if(d.name && d.name.startsWith("C2MMVP")) indexedDB.deleteDatabase(d.name);
    }
  }catch(e){}
  location.reload();
}

const REFERENTIEL_STORAGE_KEY_V74="evaluation_competencies_v74";
function loadCustomCompetencies(){
  try{
    const raw=localStorage.getItem(REFERENTIEL_STORAGE_KEY_V74) || localStorage.getItem("evaluation_competencies_v71");
    if(!raw)return;
    const parsed=JSON.parse(raw);
    if(Array.isArray(parsed)&&parsed.length){
      competencies=parsed;
      if(!localStorage.getItem(REFERENTIEL_STORAGE_KEY_V74)) localStorage.setItem(REFERENTIEL_STORAGE_KEY_V74,JSON.stringify(parsed));
    }
  }catch(e){console.warn("Référentiel personnalisé non chargé",e);}
}
function persistCompetencies(){
  localStorage.setItem(REFERENTIEL_STORAGE_KEY_V74,JSON.stringify(competencies));
}

function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open("C2MMVP_TEST_FICTIFS_V8",1);
    req.onupgradeneeded=()=>{
      const d=req.result;
      if(!d.objectStoreNames.contains("students")) d.createObjectStore("students",{keyPath:"id"});
      if(!d.objectStoreNames.contains("evaluations")){
        const st=d.createObjectStore("evaluations",{keyPath:"id",autoIncrement:true});
        st.createIndex("studentId","studentId",{unique:false});
      }
    };
    req.onsuccess=()=>{db=req.result;resolve(db)};
    req.onerror=()=>reject(req.error);
  });
}
function tx(store,mode="readonly"){
  return db.transaction(store,mode).objectStore(store);
}
function getAll(store){
  return new Promise((resolve,reject)=>{
    const r=tx(store).getAll(); r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
  });
}
function put(store,obj){
  return new Promise((resolve,reject)=>{
    const r=tx(store,"readwrite").put(obj); r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
  });
}
function deleteFromStore(store,key){
  return new Promise((resolve,reject)=>{
    const r=tx(store,"readwrite").delete(key);
    r.onsuccess=()=>resolve();
    r.onerror=()=>reject(r.error);
  });
}
function clearStore(store){
  return new Promise((resolve,reject)=>{
    const r=tx(store,"readwrite").clear(); r.onsuccess=()=>resolve(); r.onerror=()=>reject(r.error);
  });
}
async function loadData(){
  await openDB();
  let stored=await getAll("students");
  if(!stored.length){
    for(const s of DEFAULT_STUDENTS) await put("students",s);
    stored=DEFAULT_STUDENTS.slice();
  }
  students=stored.map(s=>({...s,evaluations:[]}));
  // Always point selectedStudent to an existing student.
  if(!students.some(s=>String(s.id)===String(selectedStudent))){
    selectedStudent=sortStudentsAlpha(students)[0]?.id || null;
  }
  const evals=await getAll("evaluations");
  evals.forEach(e=>{
    const s=students.find(x=>x.id===e.studentId);
    if(s) s.evaluations.push({...e});
  });
  students.forEach(s=>s.evaluations.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)));
  ready=true;
  render();
}
async function persistEvaluation(e,isEdit=false){
  await openDB();
  if(isEdit){
    await deleteFromStore("evaluations",e.id);
    await put("evaluations",e);
    return e.id;
  }
  const generatedId=await put("evaluations",e);
  // IndexedDB autoIncrement generated the real identifier. Keep it in memory
  // so "Visualiser / Modifier / Supprimer" target the correct pupil.
  e.id=generatedId;
  return generatedId;
}
async function deleteCollective(batchId){
  const key=String(batchId);
  const members=[];
  students.forEach(st=>{
    (st.evaluations||[]).forEach(ev=>{
      if(ev && ev.batchId && String(ev.batchId)===key) members.push({student:st,ev});
    });
  });
  if(!members.length){showWarningMessage("Aucune évaluation collective trouvée.");return;}
  const n=members.length;
  showDeleteConfirmation(
    `Supprimer définitivement cette évaluation collective pour les ${n} élèves ? Cette action supprimera toutes les évaluations de cette session collective.`,
    ()=>performDeleteCollective(n,members)
  );
}
async function performDeleteCollective(n,members){
  try{
    await openDB();
    for(const m of members) if(m.ev?.id!==undefined && m.ev?.id!==null) await deleteFromStore("evaluations",m.ev.id);
    viewedEvaluation=null;
    await loadData();
    showSuccessMessage(`Les ${n} évaluations ont été supprimées.`);
  }catch(err){showWarningMessage("Erreur lors de la suppression collective : "+(err?.message||String(err)));}
}

async function deleteEvaluation(evaluationId,studentIdHint){
  const id=String(evaluationId);
  const found=findEvaluationOwner(id,studentIdHint);
  const owner=found.owner, ev=found.ev;
  if(!ev){showWarningMessage("Évaluation introuvable.");return;}
  showDeleteConfirmation(
    `Supprimer définitivement l’évaluation « ${ev.title||"Sans intitulé"} » du ${ev.date||""} ?`,
    ()=>performDeleteEvaluation(id,owner,ev)
  );
}
async function performDeleteEvaluation(id,owner,ev){
  try{
    await openDB();
    await deleteFromStore("evaluations",ev.id);
    owner.evaluations=owner.evaluations.filter(x=>String(x.id)!==id);
    selectedStudent=owner.id;
    viewedEvaluation=null;
    showSuccessMessage("Évaluation supprimée de l’historique.",()=>go("history"));
  }catch(err){showWarningMessage("Erreur lors de la suppression : "+(err?.message||String(err)));}
}

function collapseAllCollectiveRows(){
  document.querySelectorAll('.home-collective-child').forEach(r=>{
    r.style.display='none';
  });
  document.querySelectorAll('.reduce-icon[data-toggle]').forEach(b=>{
    b.style.display='none';
    b.textContent='▲';
    b.setAttribute('aria-label','Réduire');
    b.setAttribute('title','Réduire');
  });
}

function toggleCollectiveRow(key){
  const rows=document.querySelectorAll(`[data-collective="${CSS.escape(String(key))}"]`);
  const isOpening=[...rows].some(r=>r.style.display==="none");
  rows.forEach(r=>r.style.display=isOpening?"table-row":"none");
  const btn=document.querySelector(`[data-toggle="${CSS.escape(String(key))}"]`);
  if(btn){
    btn.style.display=isOpening?"inline-flex":"none";
    btn.textContent="▲";
    btn.setAttribute("aria-label","Réduire");
    btn.setAttribute("title","Réduire");
  }
}
function recent(){
  // Regrouper d'abord les évaluations collectives, puis limiter le nombre
  // d'éléments affichés. Ainsi, une évaluation collective n'est jamais
  // tronquée : tous ses élèves restent dans le groupe.
  let all=[];
  students.forEach(st=>st.evaluations.forEach(ev=>all.push({
    student:st.name,studentId:st.id,...ev
  })));
  if(!all.length)return '<p class="muted">Aucune évaluation enregistrée.</p>';

  const groupMap=new Map();
  all.forEach(e=>{
    const key=e.batchId?String(e.batchId):"single-"+String(e.id);
    if(!groupMap.has(key)){
      groupMap.set(key,{
        key,
        collective:!!e.batchId,
        date:e.date,
        title:e.title,
        place:e.place,
        comps:e.comps,
        createdAt:e.createdAt||0,
        items:[]
      });
    }
    groupMap.get(key).items.push(e);
  });

  // Trier les groupes par date/création, sans jamais couper les membres d'un groupe.
  function evaluationDateValue(value){
    if(!value) return 0;
    const s=String(value).trim();
    // Formats handled: YYYY-MM-DD, DD/MM/YYYY, DD-MM-YYYY, and DD/MM/YYYY HH:mm.
    let m=s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
    if(m) return new Date(Number(m[1]),Number(m[2])-1,Number(m[3])).getTime();
    m=s.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})/);
    if(m) return new Date(Number(m[3]),Number(m[2])-1,Number(m[1])).getTime();
    const t=Date.parse(s);
    return Number.isNaN(t)?0:t;
}
let groups=[...groupMap.values()]
    .sort((a,b)=>{
      const dateDiff=evaluationDateValue(b.date)-evaluationDateValue(a.date);
      return dateDiff || ((b.createdAt||0)-(a.createdAt||0));
    })
    .slice(0,20);

  // Une seule évaluation dans un groupe = affichage individuel.
  // Cela corrige également les anciennes évaluations individuelles
  // qui auraient reçu par erreur un batchId.
  groups.forEach(g=>{
    if(g.items.length<=1) g.collective=false;
  });

  let body="";
  groups.forEach(g=>{
    if(!g.collective){
      const e=g.items[0];
      body+=`<tr onclick="viewEvaluation('${String(e.id)}')" style="cursor:pointer" title="Cliquer pour visualiser" class="home-individual-row"><td>${esc(e.date)}</td><td><b>${esc(e.student)}</b></td><td>${esc(e.title)}</td><td>${e.comps.map(competenceLabel).join("<br>")}</td><td><span class="score-badge ${scoreClass(evaluationScore20(e))}">${evaluationScoreLabel(e)}</span></td><td><button class="action-icon action-edit" onclick="event.stopPropagation();editEvaluation('${String(e.id)}','${String(e.studentId)}')" title="Modifier" aria-label="Modifier">✏️</button><button class="action-icon action-delete" onclick="event.stopPropagation();deleteEvaluation('${String(e.id)}','${String(e.studentId)}')" title="Supprimer" aria-label="Supprimer">🗑️</button></td></tr>`;
    }else{
      const id="collective-"+g.key.replace(/[^a-zA-Z0-9_-]/g,"_");
      body+=`<tr class="click home-collective-row" onclick="toggleCollectiveRow('${esc(id)}')" style="cursor:pointer;background:#f8fafc">
        <td>${esc(g.date)}</td><td><b>👥 Évaluation collective</b></td><td>${esc(g.title)}</td><td>${g.comps.map(competenceLabel).join("<br>")}</td><td><span class="pill">${g.items.length} élèves</span></td>
        <td><div class="action-buttons" style="display:flex;flex-wrap:nowrap;align-items:center;gap:6px;white-space:nowrap">
          <button class="reduce-icon" type="button" data-toggle="${esc(id)}" onclick="event.stopPropagation();toggleCollectiveRow('${esc(id)}')" title="Réduire" aria-label="Réduire" style="display:none">▲</button>
          <button class="action-icon action-delete" type="button" onclick="event.stopPropagation();deleteCollective('${String(g.key)}')" title="Supprimer toute l’évaluation collective" aria-label="Supprimer toute l’évaluation collective">🗑️</button>
        </div></td>
      </tr>`;
      g.items.forEach(e=>{
        body+=`<tr onclick="viewEvaluation(\'${String(e.id)}\')" style="display:none;cursor:pointer" title="Cliquer pour visualiser" class="history-collective-child home-collective-child" data-collective="${esc(id)}">
          <td>${esc(e.date)}</td><td style="padding-left:28px">↳ ${esc(e.student)}</td><td>${esc(e.title)}</td><td>${e.comps.map(competenceLabel).join("<br>")}</td><td><span class="score-badge ${scoreClass(evaluationScore20(e))}">${evaluationScoreLabel(e)}</span></td>
          <td><button class="action-icon action-edit" onclick="event.stopPropagation();editEvaluation('${String(e.id)}','${String(e.studentId)}')" title="Modifier" aria-label="Modifier">✏️</button><button class="action-icon action-delete" onclick="event.stopPropagation();deleteEvaluation('${String(e.id)}','${String(e.studentId)}')" title="Supprimer" aria-label="Supprimer">🗑️</button></td>
        </tr>`;
      });
    }
  });
  return `<table class="evaluation-history-table"><tr class="evaluation-history-header"><th>Date</th><th>Type / élève</th><th>Situation</th><th>Compétences</th><th>Note / groupe</th><th>Action</th></tr>${body}</table>`;
}

${sortStudentsAlpha(students).map(s=>`<tr class="click" onclick="openStudent('${s.id}')"><td><b>${esc(s.name)}</b></td><td>${s.evaluations.length}</td><td>${s.evaluations.length?esc(s.evaluations.at(-1).date):"—"}</td></tr>`).join("")}</table></div>`;

function findEvaluationOwner(evaluationId,studentIdHint){
  const id=String(evaluationId);
  if(studentIdHint!==undefined && studentIdHint!==null){
    const hinted=students.find(s=>String(s.id)===String(studentIdHint));
    const hintedEv=hinted?.evaluations.find(e=>String(e.id)===id);
    if(hintedEv) return {owner:hinted,ev:hintedEv};
  }
  for(const st of students){
    const found=st.evaluations.find(e=>String(e.id)===id);
    if(found) return {owner:st,ev:found};
  }
  return {owner:null,ev:null};
}

function editEvaluation(evaluationId,studentIdHint){
  const id=String(evaluationId);
  const found=findEvaluationOwner(id,studentIdHint);
  const owner=found.owner, ev=found.ev;
  if(!ev){alert("Évaluation introuvable.");return;}
  selectedStudent=owner.id;
  draft={
    editId:ev.id,
    title:ev.title||"",
    date:ev.date||"",
    place:ev.place||"Centre",
    type:ev.type||"TP",
    comps:[...(ev.comps||[])],
    levels:{...(ev.levels||{})},
    obs:{...(ev.obs||{})},
    disabledCriteria:{...(ev.disabledCriteria||{})},
    mode:"individual",
    targetStudents:[owner.id],
    batchId:ev.batchId||null,
    attachment:ev.attachment||null
  };
  page="eval";
  render();
  requestAnimationFrame(()=>updateCriteriaRestoreButton());
}

function startEvaluation(){
  if(!students.length){
    alert("Aucun élève n’est disponible.");
    return;
  }
  if(!students.some(s=>String(s.id)===String(selectedStudent))){
    selectedStudent=sortStudentsAlpha(students)[0]?.id || null;
  }
  if(!selectedStudent){

function toISODateValue(v){
  if(!v) return "";
  const m=String(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return `${m[3]}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;
  const m2=String(v).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m2) return `${m2[1]}-${String(m2[2]).padStart(2,"0")}-${String(m2[3]).padStart(2,"0")}`;
  return "";
}
function displayDateValue(v){
  if(!v) return "";
  const m=String(v).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return `${String(m[3]).padStart(2,"0")}/${String(m[2]).padStart(2,"0")}/${m[1]}`;
  return v;
}


function formatFileSize(bytes){if(!bytes)return "";if(bytes<1024)return bytes+" o";if(bytes<1048576)return (bytes/1024).toFixed(0)+" Ko";return (bytes/1048576).toFixed(1)+" Mo";}
function attachmentIsImage(a){return !!a&&String(a.type||"").startsWith("image/");}
function prepareImageAttachment(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=()=>reject(r.error||new Error("Lecture impossible"));r.onload=()=>{const img=new Image();img.onload=()=>{const max=1600,ratio=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*ratio));c.height=Math.max(1,Math.round(img.height*ratio));c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{if(!b)return reject(new Error("Compression impossible"));const fr=new FileReader();fr.onload=()=>resolve({name:file.name||"photo.jpg",type:"image/jpeg",size:b.size,dataUrl:fr.result});fr.onerror=()=>reject(fr.error||new Error("Lecture impossible"));fr.readAsDataURL(b)},"image/jpeg",.78)};img.onerror=()=>reject(new Error("Image invalide"));img.src=r.result};r.readAsDataURL(file)})}
function prepareGenericAttachment(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=()=>reject(r.error||new Error("Lecture impossible"));r.onload=()=>resolve({name:file.name,type:file.type||"application/octet-stream",size:file.size,dataUrl:r.result});r.readAsDataURL(file)})}
async function handleEvaluationAttachment(input){const file=input.files&&input.files[0];if(!file)return;try{if(file.size>15*1024*1024&&!file.type.startsWith("image/")){alert("Le fichier est trop volumineux. Limite : 15 Mo.");return}draft.attachment=file.type.startsWith("image/")?await prepareImageAttachment(file):await prepareGenericAttachment(file);render()}catch(err){alert("Impossible d’ajouter le fichier : "+err.message)}finally{input.value=""}}

function attachmentHtml(a){if(!a)return "";const label=esc(a.name||"Pièce jointe"),href=a.dataUrl||"#";return attachmentIsImage(a)?`<div><img src="${href}" alt="${label}" style="max-width:220px;max-height:160px;border-radius:10px;display:block;margin-bottom:8px"><a href="${href}" target="_blank" rel="noopener">${label}</a> · ${formatFileSize(a.size)}</div>`:`<div><a href="${href}" target="_blank" rel="noopener">📎 ${label}</a> · ${formatFileSize(a.size)}</div>`}

    const next=idx>=0 ? criteria[idx+1] : null;

function toggleCriterion(key,btn){
  if(!draft.disabledCriteria) draft.disabledCriteria={};
  const disabledNow=!!draft.disabledCriteria[key];
  const disabledNext=!disabledNow;

  if(disabledNext) draft.disabledCriteria[key]=true;
  else delete draft.disabledCriteria[key];

  const criterion=btn ? btn.closest(".criterion") : null;
  if(criterion){
    // Dans tous les cas, un critère désactivé disparaît de la liste.
    // Les critères déjà désactivés d'une évaluation modifiée restent
    // accessibles via le bouton "Critères" à droite.
    if(disabledNext) criterion.style.display="none";
    else criterion.style.display="";

    btn.disabled=false;
    btn.classList.toggle("danger",disabledNext);
    btn.classList.toggle("secondary",!disabledNext);
    btn.textContent=disabledNext?"↩ Activer":"⏸ Désactiver";
    btn.title=disabledNext?"Réactiver ce critère":"Désactiver ce critère";
    btn.setAttribute("aria-label",btn.title);

    criterion.querySelectorAll(".levels .level").forEach(b=>{
      b.disabled=disabledNext;
      b.style.opacity=disabledNext?"0.45":"";
    });
  }

  updateCriteriaRestoreButton();
  updateLiveEvaluationScore();
}

const SETTINGS_ADMIN_KEY="evaluation_admin_code_v71";
const SETTINGS_DEFAULT_CODE="1234";

function getAdminCode(){
  return localStorage.getItem(SETTINGS_ADMIN_KEY)||SETTINGS_DEFAULT_CODE;
}

  const code=await requestAdminCodeMasked("Saisis le code administrateur pour accéder aux paramètres :");
  if(code===null)return;

    return;
  }

}
function renderSettingsPage(){

function changeAdminCode(){
  const current=document.getElementById("settings-current-code")?.value||"";
  const next=document.getElementById("settings-new-code")?.value||"";
  const confirmCode=document.getElementById("settings-confirm-code")?.value||"";
  const previous=getAdminCode();
  if(current!==previous){showWarningMessage("Le code administrateur actuel est incorrect.");return;}
  if(next.length<4){showWarningMessage("Le nouveau code doit contenir au moins 4 caractères.");return;}
  if(next!==confirmCode){showWarningMessage("La confirmation du nouveau code ne correspond pas.");return;}
  if(next===previous){showWarningMessage("Le nouveau code doit être différent de l'ancien.");return;}
  localStorage.setItem(SETTINGS_ADMIN_KEY,next);
  // Remove any obsolete administrator-code storage keys so an old code cannot
  // remain valid through a legacy fallback.
  ["adminCode","admin_code","settings_admin_code","evaluation_admin_code"].forEach(k=>{
    if(k!==SETTINGS_ADMIN_KEY)localStorage.removeItem(k);
  });
  // Authentication is always read from SETTINGS_ADMIN_KEY, so the previous
  // value is no longer accepted immediately after this write.
  document.getElementById("settings-current-code").value="";
  document.getElementById("settings-new-code").value="";
  document.getElementById("settings-confirm-code").value="";
  showSuccessMessage("Le code administrateur a été modifié. L'ancien code n'est plus valable.");
}

function parseStudentCSV(text){
  const lines=text.replace(/\r/g,"").split("\n").filter(x=>x.trim()!=="");
  if(!lines.length)return [];
  const sep=lines[0].includes(";")?";":",";
  const norm=v=>String(v||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const headers=lines[0].split(sep).map(norm);
  const ni=headers.indexOf("nom"), pi=headers.indexOf("prenom");
  if(ni<0||pi<0)throw new Error("Le fichier doit contenir les colonnes « Nom » et « Prénom ».");
  return lines.slice(1).map(line=>{
    const cols=line.split(sep);
    return {name:[cols[ni]||"",cols[pi]||""].map(x=>x.trim()).filter(Boolean).join(" ")};
  }).filter(x=>x.name);
}

async function importXLSXStudents(file){
  const buf=await file.arrayBuffer();
  const bytes=new Uint8Array(buf);
  function u16(i){return bytes[i]|(bytes[i+1]<<8)}
  function u32(i){return (bytes[i]|(bytes[i+1]<<8)|(bytes[i+2]<<16)|(bytes[i+3]<<24))>>>0}
  function inflate(data){
    // DecompressionStream is available in current Chromium/Edge/Firefox/Safari.
    return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
  }
  async function unzipEntries(){
    const out={};
    for(let i=0;i<bytes.length-3;i++){
      if(u32(i)!==0x04034b50)continue;
      const method=u16(i+8), csize=u32(i+18), nlen=u16(i+26), elen=u16(i+28);
      const name=new TextDecoder().decode(bytes.slice(i+30,i+30+nlen));
      const start=i+30+nlen+elen, data=bytes.slice(start,start+csize);
      let raw;
      if(method===0) raw=data.buffer;
      else if(method===8) raw=await inflate(data);
      else continue;
      out[name]=new TextDecoder().decode(new Uint8Array(raw));
      i=start+csize-1;
    }
    return out;
  }
  const entries=await unzipEntries();
  const parser=new DOMParser();
  const shared=[];
  if(entries["xl/sharedStrings.xml"]){
    const d=parser.parseFromString(entries["xl/sharedStrings.xml"],"application/xml");
    d.querySelectorAll("si").forEach(si=>shared.push([...si.querySelectorAll("t")].map(t=>t.textContent).join("")));
  }
  const sheetName=Object.keys(entries).find(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k));
  if(!sheetName)throw new Error("Aucune feuille Excel lisible trouvée.");
  const d=parser.parseFromString(entries[sheetName],"application/xml");
  const rows=[...d.querySelectorAll("row")].map(row=>{
    const vals=[];
    row.querySelectorAll("c").forEach(c=>{
      const ref=c.getAttribute("r")||"";
      const col=(ref.match(/[A-Z]+/)||["A"])[0];
      let idx=0;for(const ch of col)idx=idx*26+(ch.charCodeAt(0)-64);idx--;
      const t=c.getAttribute("t"), v=c.querySelector("v"), is=c.querySelector("is");
      let val="";
      if(t==="s"&&v)val=shared[Number(v.textContent)]??"";
      else if(t==="inlineStr"&&is)val=[...is.querySelectorAll("t")].map(x=>x.textContent).join("");
      else if(v)val=v.textContent;
      vals[idx]=val;
    });
    return vals;
  }).filter(r=>r.some(v=>String(v||"").trim()!==""));
  if(!rows.length)throw new Error("Le fichier Excel est vide.");
  const norm=v=>String(v||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const headers=rows[0].map(norm), ni=headers.indexOf("nom"), pi=headers.indexOf("prenom");
  if(ni<0||pi<0)throw new Error("Le fichier doit contenir les colonnes « Nom » et « Prénom ».");
  return rows.slice(1).map(r=>({name:[r[ni]||"",r[pi]||""].map(x=>String(x).trim()).filter(Boolean).join(" ")})).filter(x=>x.name);
}

async function importStudentsFromExcelFile(input){
  const file=input?.files?.[0];if(!file)return;
  try{
    const incoming=/\.xlsx$/i.test(file.name)
      ? await importXLSXStudents(file)
      : parseStudentCSV(await file.text());
    if(!incoming.length){showWarningMessage("Aucun élève trouvé dans le fichier.");return;}
    const existing=new Set(students.map(s=>String(s.name||"").trim().toLowerCase()));
    const fresh=incoming.filter(x=>!existing.has(x.name.toLowerCase()));
    if(!fresh.length){showWarningMessage("Tous les élèves du fichier sont déjà présents.");return;}
    await openDB();
    for(const x of fresh){
      const student={id:"stu_"+Date.now()+"_"+Math.random().toString(36).slice(2,9),name:x.name,evaluations:[]};
      await put("students",student);students.push(student);
    }
    renderSettingsStudents();
    showSuccessMessage(`${fresh.length} élève(s) importé(s). Les doublons ont été ignorés.`);
  }catch(err){
    showWarningMessage("Impossible de lire le fichier : "+(err?.message||String(err)));
  }finally{input.value="";}
}

function renderSettingsStudents(){
  const box=document.getElementById("settings-students-list");if(!box)return;
  const list=[...students].sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"fr"));
  box.innerHTML=list.map(s=>`<div class="settings-item">
    <div class="settings-item-main"><div class="settings-item-title">${esc(s.name||"")}</div><div class="settings-item-sub">${(s.evaluations||[]).length} évaluation(s)</div></div>
    <div class="settings-actions">
      <button class="secondary" onclick="renameStudentFromSettings('${esc(String(s.id))}')">Modifier</button>
      <button class="secondary settings-danger" onclick="deleteStudentFromSettings('${esc(String(s.id))}')">Supprimer</button>
    </div>
  </div>`).join("")||"<p>Aucun élève.</p>";
}
async function addStudentFromSettings(){
  const input=document.getElementById("settings-student-name"),name=input?.value.trim();
  if(!name){showWarningMessage("Saisis le nom de l'élève.");return;}
  if(students.some(s=>String(s.name||"").trim().toLowerCase()===name.toLowerCase())){
    showWarningMessage("Cet élève existe déjà.");return;
  }
  const student={id:"stu_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),name,evaluations:[]};
  await openDB();await put("students",student);
  students.push(student);input.value="";renderSettingsStudents();
  showSuccessMessage("Élève ajouté.");
}
async function renameStudentFromSettings(id){
  const s=students.find(x=>String(x.id)===String(id));if(!s)return;
  const name=prompt("Nouveau nom de l'élève :",s.name||"");if(name===null)return;
  const clean=name.trim();if(!clean){showWarningMessage("Le nom ne peut pas être vide.");return;}
  s.name=clean;await openDB();await put("students",{id:s.id,name:s.name});
  renderSettingsStudents();showSuccessMessage("Nom de l'élève modifié.");
}
async function deleteStudentFromSettings(id){
  const s=students.find(x=>String(x.id)===String(id));if(!s)return;
  showDeleteConfirmation(`Supprimer l'élève « ${s.name} » et toutes ses évaluations ?`,async()=>{
    try{
      await openDB();
      const evals=await getAll("evaluations");
      for(const ev of evals)if(String(ev.studentId)===String(s.id))await deleteFromStore("evaluations",ev.id);
      await deleteFromStore("students",s.id);
      students=students.filter(x=>String(x.id)!==String(id));
      if(String(selectedStudent)===String(id))selectedStudent=sortStudentsAlpha(students)[0]?.id||null;
      renderSettingsStudents();showSuccessMessage("Élève supprimé.");
    }catch(err){showWarningMessage("Erreur lors de la suppression de l'élève : "+(err?.message||String(err)));}
  });
}


function exportStudentDeletionExcel(studentsSnapshot, deletionDate){
  const rows=[];
  studentsSnapshot.forEach(s=>{
    const parts=String(s.name||"").trim().split(/\s+/);
    const prenom=parts.length>1?parts.pop():"";
    const nom=parts.join(" ");
    const evals=(s.evaluations||[]);
    if(!evals.length){
      rows.push({nom,prenom,date:"",situation:"",type:"",competenceCode:"",competenceName:"",critere:"",niveau:"",dateSuppression:deletionDate});
      return;
    }
    evals.forEach(ev=>{
      const comps=ev.comps||[];
      let hadCriterion=false;
      comps.forEach(cid=>{
        const comp=competencies.find(c=>String(c.id)===String(cid));
        if(!comp){
          rows.push({nom,prenom,date:ev.date||"",situation:ev.title||"",type:ev.type||"",competenceCode:String(cid),competenceName:"",critere:"",niveau:"",dateSuppression:deletionDate});
          return;
        }
        comp.criteria.forEach((cr,i)=>{
          const key=cid+"-"+i;
          const disabled=ev.disabledCriteria?.[key];
          const level=ev.levels?.[key]||"";
          rows.push({
            nom,prenom,date:ev.date||"",situation:ev.title||"",type:ev.type||"",
            competenceCode:String(comp.code||cid),
            competenceName:String(comp.title||comp.name||""),
            critere:String(cr?.text||cr?.label||cr||"")+(disabled?" (désactivé)":""),
            niveau:disabled?"Désactivé":String(level),
            dateSuppression:deletionDate
          });
          hadCriterion=true;
        });
      });

/* =========================
   V74 — Import de référentiel PDF
   ========================= */
const PDFJS_VERSION_V74="4.4.168";
let pdfJsPromiseV74=null;

async function loadPdfJsV74(){
  if(pdfJsPromiseV74) return pdfJsPromiseV74;
  pdfJsPromiseV74=(async()=>{
    const mod=await import(`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION_V74}/pdf.min.mjs`);
    mod.GlobalWorkerOptions.workerSrc=`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION_V74}/pdf.worker.min.mjs`;
    return mod;
  })();
  return pdfJsPromiseV74;
}

function cleanReferentielPdfLineV74(value){
  let t=String(value??"").replace(/\u00ad/g,"").replace(/\s+/g," ").trim();
  t=t.replace(/Identifierles/g,"Identifier les").replace(/A1\.4Réalisation/g,"A1.4 Réalisation");
  return t;
}

function mergeLowercaseContinuationsV74(lines){
  const out=[];
  for(const raw of lines){
    const t=cleanReferentielPdfLineV74(raw);
    if(!t){out.push("");continue;}
    const prev=out[out.length-1];
    if(prev && /^[a-zàâçéèêëîïôûùüÿœæ]/.test(t) && !/[.:;?!]$/.test(prev)) out[out.length-1]=prev+" "+t;
    else out.push(t);
  }
  return out;
}

function parseReferentielPdfTextV74(rawText){
  let text=String(rawText||"").replace(/\r/g,"").replace(/\u00a0/g," ");
  const start=text.indexOf("Annexe III - Référentiel de compétences");
  const end=text.indexOf("Annexe IV - Référentiel d’évaluation");
  if(start<0) throw new Error("L’annexe III du référentiel n’a pas été trouvée dans le PDF.");
  const scoped=text.slice(start,end>start?end:text.length);
  const lines=mergeLowercaseContinuationsV74(scoped.split("\n"));
  const starts=[];
  for(let i=0;i<lines.length;i++){
    const m=lines[i].match(/^(C[12]\.\d)\s*(.*)$/);
    if(!m) continue;
    const window=lines.slice(i,i+18).join(" ");
    if(/Principale?s? activité/i.test(window)) starts.push({i,code:m[1]});
  }
  if(starts.length<1) throw new Error("Aucune compétence exploitable n’a été trouvée dans l’annexe III.");

  const result=[];
  starts.forEach((st,idx)=>{
    const endIdx=idx+1<starts.length?starts[idx+1].i:lines.length;
    const section=lines.slice(st.i,endIdx);
    const code=st.code;
    const titleParts=[];
    const firstRest=(lines[st.i].match(/^C[12]\.\d\s*(.*)$/)||[])[1]||"";
    const previousTitleLine=(st.i>0 && lines[st.i-1] && !/^\d+$/.test(lines[st.i-1]) && !/^Annexe/i.test(lines[st.i-1]))?lines[st.i-1]:"";
    if(firstRest){
      if(/^[a-zàâçéèêëîïôûùüÿœæ]/.test(firstRest) && previousTitleLine) titleParts.push(previousTitleLine);
      titleParts.push(firstRest);
    }else if(previousTitleLine) titleParts.push(previousTitleLine);
    let k=st.i+1;
    while(k<endIdx && !/^Principale?s? activité/i.test(lines[k])){
      if(lines[k] && !/^\d+$/.test(lines[k])) titleParts.push(lines[k]);
      k++;
    }
    const name=cleanReferentielPdfLineV74(titleParts.join(" "))
      .replace(/^C[12]\.\d\s*/i,"").trim();

    const activityLines=[];
    if(k<endIdx) k++;
    while(k<endIdx && !/^Connaissances associées/i.test(lines[k])){
      if(lines[k] && !/^\d+$/.test(lines[k])) activityLines.push(lines[k]);
      k++;
    }
    const activities=activityLines.filter(x=>!/^Principale?s? activité/i.test(x));

    const knowledge=[];
    const knowStart=lines.findIndex((x,i)=>i>=st.i && i<endIdx && /^Connaissances associées/i.test(x));
    const criteriaStart=lines.findIndex((x,i)=>i>=st.i && i<endIdx && /^Critères d’évaluation de la compétence/i.test(x));
    if(knowStart>=0 && criteriaStart>knowStart){
      for(const line of lines.slice(knowStart+1,criteriaStart)){
        if(!line || /^\d+$/.test(line)) continue;
        const km=line.match(/^(.*?)\s+Niveau\s+([1-4])$/i);
        if(km) knowledge.push({text:cleanReferentielPdfLineV74(km[1]),level:Number(km[2])});
      }
    }

    const criteria=[];
    if(criteriaStart>=0){
      let group="";
      let pending="";
      const flush=()=>{if(pending){criteria.push({group,text:cleanReferentielPdfLineV74(pending)});pending="";}};
      for(const raw of lines.slice(criteriaStart+1,endIdx)){
        const line=cleanReferentielPdfLineV74(raw);
        if(!line || /^\d+$/.test(line)){flush();continue;}
        if(line.startsWith("*")||/^particularités du domaine/i.test(line)) continue;
        if(/^(?:|•|[-–])\s*/.test(line)){
          flush();
          pending=line.replace(/^(?:|•|[-–])\s*/,"").trim();
          continue;
        }
        if(line.endsWith(":")){
          flush();
          group=line.slice(0,-1).trim();
          continue;
        }
        if(pending) pending+=" "+line;
        else criteria.push({group,text:line});
      }
      flush();
    }

    const block=code.startsWith("C1")?"BLOC N°1 — RÉALISER L’ENTRETIEN PÉRIODIQUE DES VÉHICULES":"BLOC N°2 — RÉALISER LA MAINTENANCE CORRECTIVE DES VÉHICULES";
    result.push({
      id:code,
      name:name||code,
      block,
      activity:activities[0]||"",
      activities,
      knowledge,
      criteria,
      source:"PDF importé",
      sourceVersion:"V74"
    });
  });
  return result;
}

async function extractReferentielPdfTextV74(file){
  const pdfjs=await loadPdfJsV74();
  const data=new Uint8Array(await file.arrayBuffer());
  const pdf=await pdfjs.getDocument({data}).promise;
  const pages=[];
  for(let pageNo=1;pageNo<=pdf.numPages;pageNo++){
    const page=await pdf.getPage(pageNo);
    const content=await page.getTextContent();
    const rows=[];
    for(const item of content.items){
      const value=String(item.str??"").trim();
      if(!value)continue;
      const y=Number(item.transform?.[5]||0);
      const x=Number(item.transform?.[4]||0);
      let row=rows.find(r=>Math.abs(r.y-y)<2.5);
      if(!row){row={y,items:[]};rows.push(row);}
      row.items.push({x,value});
    }
    rows.sort((a,b)=>b.y-a.y);
    const lines=rows.map(row=>row.items.sort((a,b)=>a.x-b.x).map(x=>x.value).join(" "));
    pages.push(lines.join("\n"));
  }
  return pages.join("\n\f\n");
}

async function importReferentielPdfFile(input){
  const file=input?.files?.[0]; if(!file)return;
  try{
    if(file.size>30*1024*1024) throw new Error("Le PDF est trop volumineux. Limite : 30 Mo.");
    showSuccessMessage("Lecture du PDF en cours…");
    const text=await extractReferentielPdfTextV74(file);

    pendingReferentielImport={fileName:file.name,importedAt:new Date().toISOString(),competencies:parsed,rawText:text};

  }finally{input.value="";}
}

function collectReviewedReferentielV74(){
  if(!pendingReferentielImport)return [];
  const out=[];
  for(let i=0;i<pendingReferentielImport.competencies.length;i++){
    if(!document.getElementById(`ref-review-selected-${i}`)?.checked) continue;
    const base=pendingReferentielImport.competencies[i];
    const id=(document.getElementById(`ref-review-code-${i}`)?.value||"").trim();
    const name=(document.getElementById(`ref-review-name-${i}`)?.value||"").trim();
    if(!id||!name) throw new Error(`La compétence n°${i+1} doit avoir un code et un intitulé.`);
    out.push({...base,id,name,criteria:Array.isArray(base.criteria)?base.criteria.map(x=>({...x})):[]});
  }
  const ids=new Set();
  for(const c of out){if(ids.has(c.id))throw new Error(`Le code « ${c.id} » est présent plusieurs fois.`);ids.add(c.id);}
  if(!out.length) throw new Error("Sélectionne au moins une compétence à importer.");
  return out;
}

function validateReferentielImportV74(mode){
  try{
    const imported=collectReviewedReferentielV74();
    if(mode==="replace") competencies=imported;
    else{
      const byId=new Map((competencies||[]).map(c=>[String(c.id),c]));
      imported.forEach(c=>byId.set(String(c.id),c));
      competencies=Array.from(byId.values());
    }
    persistCompetencies();
    const count=imported.length;
    const action=mode==="replace"?"remplacé":"fusionné";
    pendingReferentielImport=null;
    showSuccessMessage(`Référentiel ${action} : ${count} compétence(s) validée(s).`,()=>go("settings"));
  }catch(err){showWarningMessage(err?.message||String(err));}
}

async function renameCompetenceFromSettings(id){
  const c=competencies.find(x=>String(x.id)===String(id));if(!c)return;
  const name=prompt("Nouvel intitulé de la compétence :",c.name||"");if(name===null)return;
  if(!name.trim()){showWarningMessage("L'intitulé ne peut pas être vide.");return;}
  c.name=name.trim();persistCompetencies();renderSettingsCompetencies();showSuccessMessage("Compétence modifiée.");
}
async function deleteCompetenceFromSettings(id){
  const c=competencies.find(x=>String(x.id)===String(id));if(!c)return;
  showDeleteConfirmation(`Supprimer la compétence « ${c.name} » et tous ses critères ?`,()=>{
    competencies=competencies.filter(x=>String(x.id)!==String(id));persistCompetencies();renderSettingsCompetencies();showSuccessMessage("Compétence supprimée.");
  });
}
async function addCriterionFromSettings(id){
  const c=competencies.find(x=>String(x.id)===String(id));if(!c)return;
  const text=prompt("Intitulé du nouveau critère :");if(text===null)return;
  if(!text.trim()){showWarningMessage("L'intitulé ne peut pas être vide.");return;}
  if(!Array.isArray(c.criteria))c.criteria=[];
  c.criteria.push({group:"A",label:"",text:text.trim()});
  persistCompetencies();renderSettingsCompetencies();showSuccessMessage("Critère ajouté.");
}
async function renameCriterionFromSettings(id,index){
  const c=competencies.find(x=>String(x.id)===String(id)),cr=c?.criteria?.[index];if(!cr)return;
  const current=typeof cr==="string"?cr:(cr.text||cr.name||"");
  const text=prompt("Nouvel intitulé du critère :",current);if(text===null)return;
  if(!text.trim()){showWarningMessage("L'intitulé ne peut pas être vide.");return;}
  if(typeof cr==="string")c.criteria[index]={group:"A",label:"",text:text.trim()};else cr.text=text.trim();
  persistCompetencies();renderSettingsCompetencies();showSuccessMessage("Critère modifié.");
}
async function deleteCriterionFromSettings(id,index){
  const c=competencies.find(x=>String(x.id)===String(id)),cr=c?.criteria?.[index];if(!cr)return;
  const name=typeof cr==="string"?cr:(cr.text||cr.name||"");
  showDeleteConfirmation(`Supprimer le critère « ${name} » ?`,()=>{
    c.criteria.splice(index,1);persistCompetencies();renderSettingsCompetencies();showSuccessMessage("Critère supprimé.");
  });
}


const SCHOOL_SETTINGS_KEY="evaluation_school_settings_v71";
function getSchoolSettings(){
  try{
    const saved=localStorage.getItem(SCHOOL_SETTINGS_KEY);
    const parsed=saved?JSON.parse(saved):{};
    return {
      className:String(parsed.className||""),
      teacherName:String(parsed.teacherName||""),
      schoolYear:String(parsed.schoolYear||"")
    };
  }catch(e){return {className:"",teacherName:"",schoolYear:""};}
}
function renderSchoolSettings(){
  const s=getSchoolSettings();
  const c=document.getElementById("settings-class-name");
  const t=document.getElementById("settings-teacher-name");
  const y=document.getElementById("settings-school-year");
  if(c)c.value=s.className;
  if(t)t.value=s.teacherName;
  if(y)y.value=s.schoolYear;
}

function renderPermanentSchoolYear(){

    el.className="permanent-school-year";
    document.body.appendChild(el);
  }
  const s=getSchoolSettings();
  el.textContent=s.schoolYear||"";

  const s=getSchoolSettings();

  document.querySelectorAll("[data-school-year]").forEach(el=>el.textContent=s.schoolYear);
}

async function saveEvaluation(){
if(!draft.title.trim()){showWarningMessage("Saisis un intitulé de situation.");return;}
if(!draft.comps.length){showWarningMessage("Sélectionne au moins une compétence.");return;}

// Vérification des critères actifs avant l'enregistrement.
// Un critère désactivé est volontairement ignoré. Les critères actifs
// doivent tous avoir un niveau sélectionné.
for(const compId of draft.comps){
  const comp=competencies.find(c=>c.id===compId);
  if(!comp) continue;
  const missing=comp.criteria.some((cr,i)=>{
    const key=compId+"-"+i;
    return !draft.disabledCriteria[key] && !draft.levels[key];
  });
  if(missing){
    showValidationMessage("Attention, tous les critères n'ont pas été évalués pour cette compétence.");
    return;
  }
}

if(draft.editId){
  const editId=String(draft.editId);
  const existingStudent=sortStudentsAlpha(students).find(s=>
    s.evaluations.some(x=>String(x.id)===editId)
  );
  const existing=existingStudent?.evaluations.find(x=>String(x.id)===editId);
  if(!existing){alert("Évaluation introuvable.");return;}

  // IMPORTANT : update the same record, preserving its id, creation date and batch.
  const updated={
    ...existing,
    id:existing.id,
    date:draft.date,
    title:draft.title.trim(),
    place:draft.place,
    type:draft.type,
    comps:[...draft.comps],
    levels:{...draft.levels},
    obs:{...draft.obs},
    disabledCriteria:{...draft.disabledCriteria},
    attachment:draft.attachment||null,
    studentId:existing.studentId
  };

  try{
    await persistEvaluation(updated,true);

    // Update the in-memory record instead of pushing a new evaluation.
    const owner=students.find(st=>st.id===existing.studentId);
    if(owner){
      const idx=owner.evaluations.findIndex(x=>String(x.id)===editId);
      if(idx>=0) owner.evaluations[idx]={...updated};
    }

    draft=null;
    selectedStudent=existing.studentId;
    showSuccessMessage("L’évaluation a été modifiée et enregistrée.",()=>go("history"));
  }catch(err){
    showWarningMessage("Erreur d’enregistrement : "+err);
  }
  return;
}

const targets = draft.mode==="collective" ? [...draft.targetStudents] : [...(draft.targetStudents||[]).slice(0,1)];
if(!targets.length){showWarningMessage("Sélectionne au moins un élève.");return;}
const validTargets=targets.filter(id=>students.some(s=>String(s.id)===String(id)));
if(validTargets.length!==targets.length){
  showWarningMessage("Un élève sélectionné n’existe plus dans la base locale. La sélection a été réinitialisée.");
  selectedStudent=sortStudentsAlpha(students)[0]?.id || null;
  draft.targetStudents=selectedStudent?[selectedStudent]:[];
  render();
  return;
}

const batchId = draft.mode==="collective" ? "B"+Date.now() : null;
const evaluations = validTargets.map((studentId,idx)=>({
  date:draft.date,
  title:draft.title.trim(),
  place:draft.place,
  type:draft.type,
  comps:[...draft.comps],
  levels:{...draft.levels},
  obs:{...draft.obs},
    disabledCriteria:{...draft.disabledCriteria},
    attachment:draft.attachment||null,
  studentId,
  createdAt:Date.now()+idx,
  batchId
}));

try{
  await Promise.all(evaluations.map(e=>persistEvaluation(e)));
  evaluations.forEach(e=>{
    const st=students.find(s=>String(s.id)===String(e.studentId));
    if(st) st.evaluations.push({...e});
  });
  const count=evaluations.length;
  draft=null;
  showSuccessMessage(
    count===1
      ?"Évaluation enregistrée dans la base locale."
      :`Évaluation enregistrée pour ${count} élèves dans la base locale.`,
    ()=>{ if(count===1){ selectedStudent=validTargets[0]; go("history"); } else go("home"); }
  );
}catch(err){
  showWarningMessage("Erreur d’enregistrement : "+err);
}
}
function cancelEvaluation(){draft=null;go("home");}


function evaluationScore20(e){
  const vals=[];
  e.comps.forEach(cid=>{
    const c=competencies.find(x=>x.id===cid);
    if(!c)return;
    c.criteria.forEach((_,i)=>{
      const key=cid+"-"+i;
      if(e.disabledCriteria && e.disabledCriteria[key]) return;
      const v=e.levels[key];
      if(v && v!=="Non observé") vals.push(levelScore(v));
    });
  });
  if(!vals.length)return null;
  return Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*5*10)/10;
}
function evaluationScoreLabel(e){
  const n=evaluationScore20(e);
  return n===null?"Non notée":n.toFixed(1).replace(".",",")+" / 20";
}
function scoreClass(n){
  if(n===null)return "";
  if(n<8)return "score-red";
  if(n<10)return "score-orange";
  if(n<14)return "score-yellow";
  return "score-green";
}

function levelScore(v){
  return {"Non observé":0,"À renforcer":1,"En cours":2,"Maîtrisé":3,"Autonome":4}[v] ?? 0;
}
function latestCompetenceScore(s,c){
  const es=s.evaluations.filter(e=>e.comps.includes(c.id));
  const last=es.at(-1);
  if(!last) return null;
  const vals=c.criteria.map((_,i)=>levelScore(last.levels[c.id+"-"+i])).filter(x=>x>0);
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
}
function drawRadar(){
  const canvas=document.getElementById("radar");
  if(!canvas)return;
  if(!canvas.clientWidth || !canvas.clientHeight){
    requestAnimationFrame(()=>drawRadar());
    return;
  }
  const s=student(), dpr=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr; canvas.height=rect.height*dpr;
  const ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr);
  const w=rect.width,h=rect.height,cx=w/2,cy=h/2+10,r=Math.min(w,h)*.34,n=competencies.length;
  ctx.clearRect(0,0,w,h);
  ctx.font="12px Arial"; ctx.textAlign="center"; ctx.textBaseline="middle";
  for(let ring=1;ring<=4;ring++){
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const a=-Math.PI/2+i*2*Math.PI/n,x=cx+Math.cos(a)*r*ring/4,y=cy+Math.sin(a)*r*ring/4;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.closePath();ctx.strokeStyle="#d9dee7";ctx.stroke();
  }
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+i*2*Math.PI/n,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);ctx.strokeStyle="#e4e7ec";ctx.stroke();
    const lx=cx+Math.cos(a)*(r+28),ly=cy+Math.sin(a)*(r+28);
    ctx.fillStyle="#344054";ctx.fillText(competencies[i].id,lx,ly);
  }
  const pts=[];
  competencies.forEach((c,i)=>{
    const v=latestCompetenceScore(s,c);
    const score=v===null?0:v;
    const a=-Math.PI/2+i*2*Math.PI/n;
    pts.push([cx+Math.cos(a)*r*score/4,cy+Math.sin(a)*r*score/4]);
  });
  if(pts.some((_,i)=>latestCompetenceScore(s,competencies[i])!==null)){
    ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();
    ctx.fillStyle="rgba(36,99,235,.14)";ctx.fill();ctx.strokeStyle="#2463eb";ctx.lineWidth=2;ctx.stroke();
    pts.forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],4,0,Math.PI*2);ctx.fillStyle="#2463eb";ctx.fill();});
  }
  ctx.fillStyle="#667085";ctx.font="11px Arial";
  ctx.fillText("4 — Autonome",cx,cy-r-15);
  ctx.fillText("0 — Non observé",cx,cy+r+15);
}
window.addEventListener("resize",()=>{if(page==="history")drawRadar()});

function historyPage(){
  setActive("history");

  const all=[];
  students.forEach(st=>{
    (st.evaluations||[]).forEach(ev=>{
      all.push({...ev,studentName:st.name,studentId:st.id});
    });
  });

  function dateValue(value){
    if(!value)return 0;
    const s=String(value).trim();
    let m=s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
    if(m)return new Date(+m[1],+m[2]-1,+m[3]).getTime();
    m=s.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})/);
    if(m)return new Date(+m[3],+m[2]-1,+m[1]).getTime();
    const t=Date.parse(s);return Number.isNaN(t)?0:t;
  }

  // Une évaluation collective possède le même batchId pour tous les élèves.
  // On regroupe donc toutes les lignes d'un même batch en une seule ligne.
  const groups=new Map();
  all.forEach(e=>{
    const key=e.batchId?`batch-${String(e.batchId)}`:`single-${String(e.id)}`;
    if(!groups.has(key)){
      groups.set(key,{
        key,
        collective:!!e.batchId,
        date:e.date,
        title:e.title,
        place:e.place,
        comps:e.comps||[],
        createdAt:e.createdAt||0,
        items:[]
      });
    }
    groups.get(key).items.push(e);
  });

  // Sécurité : un batch ne contenant qu'un seul élève reste individuel.
  groups.forEach(g=>{if(g.items.length<=1)g.collective=false;});

  const ordered=[...groups.values()].sort((a,b)=>{
    return dateValue(b.date)-dateValue(a.date) || (b.createdAt||0)-(a.createdAt||0);
  });

  let body="";
  ordered.forEach((g,index)=>{
    if(!g.collective){
      const e=g.items[0];
      body+=`<tr class="history-individual-row" onclick="viewEvaluation('${String(e.id)}')" style="cursor:pointer" title="Cliquer pour visualiser">
        <td>${esc(e.date||"")}</td>
        <td><b>${esc(e.studentName||"")}</b></td>
        <td><span class="pill">Individuelle</span></td>
        <td>${esc(e.title||"")}</td>
        <td>${(e.comps||[]).map(competenceLabel).join("<br>")||"—"}</td>
        <td><span class="score-badge ${scoreClass(evaluationScore20(e))}">${evaluationScoreLabel(e)}</span></td>
        <td><span class="actions-inline">
          <button class="action-icon action-edit" onclick="event.stopPropagation();editEvaluation('${String(e.id)}','${String(e.studentId)}')" title="Modifier" aria-label="Modifier">✏️</button>
          <button class="action-icon action-delete" onclick="event.stopPropagation();deleteEvaluation('${String(e.id)}','${String(e.studentId)}')" title="Supprimer" aria-label="Supprimer">🗑️</button>
        </span></td>
      </tr>`;
    }else{
      const id="history-collective-"+String(g.key).replace(/[^a-zA-Z0-9_-]/g,"_");
      const studentsCount=g.items.length;
      body+=`<tr class="click history-collective-row" onclick="toggleCollectiveRow('${esc(id)}')" style="cursor:pointer;background:#f8fafc" title="Cliquer pour déployer les élèves">
        <td>${esc(g.date||"")}</td>
        <td><b>👥 Évaluation collective</b></td>
        <td><span class="pill">Collective</span></td>
        <td>${esc(g.title||"")}</td>
        <td>${(g.comps||[]).map(competenceLabel).join("<br>")||"—"}</td>
        <td><span class="pill">${studentsCount} élèves</span></td>
        <td><div class="action-buttons" style="display:flex;flex-wrap:nowrap;align-items:center;gap:6px;white-space:nowrap">
          <button class="reduce-icon" type="button" data-toggle="${esc(id)}" onclick="event.stopPropagation();toggleCollectiveRow('${esc(id)}')" title="Réduire" aria-label="Réduire" style="display:none">▲</button>
          <button class="action-icon action-delete" type="button" onclick="event.stopPropagation();deleteCollective('${String(g.items[0].batchId)}')" title="Supprimer toute l’évaluation collective" aria-label="Supprimer toute l’évaluation collective">🗑️</button>
        </div></td>
      </tr>`;

      g.items.sort((a,b)=>String(a.studentName||"").localeCompare(String(b.studentName||""),"fr")).forEach(e=>{
        body+=`<tr onclick="viewEvaluation('${String(e.id)}')" style="display:none;cursor:pointer" title="Cliquer pour visualiser" class="home-collective-child" data-collective="${esc(id)}">
          <td>${esc(e.date||"")}</td>
          <td style="padding-left:28px">↳ ${esc(e.studentName||"")}</td>
          <td><span class="pill">Élève</span></td>
          <td>${esc(e.title||"")}</td>
          <td>${(e.comps||[]).map(competenceLabel).join("<br>")||"—"}</td>
          <td><span class="score-badge ${scoreClass(evaluationScore20(e))}">${evaluationScoreLabel(e)}</span></td>
          <td><span class="actions-inline">
            <button class="action-icon action-edit" onclick="event.stopPropagation();editEvaluation('${String(e.id)}','${String(e.studentId)}')" title="Modifier" aria-label="Modifier">✏️</button>
            <button class="action-icon action-delete" onclick="event.stopPropagation();deleteEvaluation('${String(e.id)}','${String(e.studentId)}')" title="Supprimer" aria-label="Supprimer">🗑️</button>
          </span></td>
        </tr>`;
      });
    }
  });

  document.getElementById("main").innerHTML=`
    <div class="page-header">
      <div>
        <h1>Historique</h1>
        <p class="sub">Toutes les évaluations enregistrées dans le logiciel.</p>
      </div>
      <button class="secondary" onclick="go('home')">← Accueil</button>
    </div>
    <div class="panel">
      <div class="row">
        <h2>Toutes les évaluations</h2>
        <span class="pill">${ordered.length} évaluation(s)</span>
      </div>
      ${ordered.length?`
      <div style="overflow-x:auto">
        <table class="evaluation-history-table">
          <tr class="evaluation-history-header">
            <th>Date</th><th>Type / élève</th><th>Type</th><th>Situation</th><th>Compétences</th><th>Note / groupe</th><th>Action</th>
          </tr>
          ${body}
        </table>
      </div>`:'<p class="muted">Aucune évaluation enregistrée.</p>'}
    </div>`;
}

function colorForScore(score){
  if(score===null)return "#98a2b3";
  if(score<1.5)return "#d92d20";
  if(score<2.5)return "#f79009";
  if(score<3.5)return "#fdb022";
  return "#12b76a";
}
function drawColoredPosition(){
  const canvas=document.getElementById("coloredPosition");
  if(!canvas)return;
  const s=student(), dpr=devicePixelRatio||1, rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  const ctx=canvas.getContext("2d");ctx.scale(dpr,dpr);
  const w=rect.width,h=rect.height,cx=w/2,cy=h/2,r=Math.min(w,h)*.34,n=competencies.length;
  ctx.clearRect(0,0,w,h);
  for(let ring=1;ring<=4;ring++){
    ctx.beginPath();
    for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n,x=cx+Math.cos(a)*r*ring/4,y=cy+Math.sin(a)*r*ring/4;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
    ctx.closePath();ctx.strokeStyle="#d0d5dd";ctx.stroke();
  }
  competencies.forEach((c,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/n, x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);ctx.strokeStyle="#eaecf0";ctx.stroke();
    const score=latestCompetenceScore(s,c);
    const rr=score===null?0:r*score/4;
    const px=cx+Math.cos(a)*rr,py=cy+Math.sin(a)*rr;
    ctx.beginPath();ctx.arc(px,py,9,0,Math.PI*2);ctx.fillStyle=colorForScore(score);ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle="#344054";ctx.font="bold 12px Arial";ctx.textAlign="center";ctx.fillText(c.id,cx+Math.cos(a)*(r+28),cy+Math.sin(a)*(r+28));
  });
  ctx.fillStyle="#667085";ctx.font="11px Arial";
  ctx.fillText("4 — Autonome",cx,cy-r-18);ctx.fillText("0 — Non observé",cx,cy+r+18);
}

function resultColor(pct){
  if(pct===null || pct===undefined || isNaN(pct)) return "#eef1f4";
  if(pct < 25) return "#d92d20";
  if(pct < 50) return "#f79009";
  if(pct < 75) return "#fdb022";
  return "#12b76a";
}
function gradientLabel(score){
  if(score===null) return "Non observé";
  if(score<1.5) return "À renforcer";
  if(score<2.5) return "En cours";
  if(score<3.5) return "À consolider";
  return "Maîtrisé / Autonome";
}

function drawPositionRadar(){
  const canvas=document.getElementById("radarPosition");
  if(!canvas)return;
  const s=student(), dpr=window.devicePixelRatio||1, rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr; canvas.height=rect.height*dpr;
  const ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr);
  const w=rect.width,h=rect.height,cx=w/2,cy=h/2+5,r=Math.min(w,h)*.34,n=competencies.length;
  ctx.clearRect(0,0,w,h);
  for(let ring=1;ring<=4;ring++){
    ctx.beginPath();
    for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n,x=cx+Math.cos(a)*r*ring/4,y=cy+Math.sin(a)*r*ring/4;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    ctx.closePath();ctx.strokeStyle="#d9dee7";ctx.stroke();
  }
  ctx.font="12px Arial";ctx.textAlign="center";ctx.textBaseline="middle";
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+i*2*Math.PI/n,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);ctx.strokeStyle="#e4e7ec";ctx.stroke();
    ctx.fillStyle="#344054";ctx.fillText(competencies[i].id,cx+Math.cos(a)*(r+27),cy+Math.sin(a)*(r+27));
  }
  const pts=[];
  competencies.forEach((c,i)=>{
    const score=latestCompetenceScore(s,c);
    const v=score===null?0:score;
    const a=-Math.PI/2+i*2*Math.PI/n;
    pts.push([cx+Math.cos(a)*r*v/4,cy+Math.sin(a)*r*v/4]);
  });
  if(s.evaluations.length){
    ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();
    ctx.fillStyle="rgba(36,99,235,.14)";ctx.fill();ctx.strokeStyle="#2463eb";ctx.lineWidth=2;ctx.stroke();
    pts.forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],4,0,Math.PI*2);ctx.fillStyle="#2463eb";ctx.fill();});
  }
  ctx.fillStyle="#667085";ctx.font="11px Arial";
  ctx.fillText("4 — Autonome",cx,cy-r-15);ctx.fillText("0 — Non observé",cx,cy+r+15);
}
window.addEventListener("resize",()=>{if(page==="position")drawPositionRadar()});


function reportLevel(score){
  if(score===null)return {label:"Non observée",pct:0};
  const pct=Math.round(score/4*100);
  let label="À renforcer";
  if(score>=3.5)label="Maîtrisé / autonome";
  else if(score>=2.5)label="À consolider";
  else if(score>=1.5)label="En cours";
  return {label,pct};
}

function competenceActivities(c){
  if(!c.activities || !c.activities.length) return "";

}

function renderCriteriaForCompetence(c,draft){
  if(!c.criteria.some(x=>typeof x==="object"&&x.group)){
    return c.criteria.map((crit,i)=>{
      const key=c.id+"-"+i, val=draft.levels[key]||"Non observé";
      return `<div class="criterion" data-criterion-key="${key}" style="display:${draft.disabledCriteria[key]?"none":""}"><div class="criterion-text">${esc(crit.text||crit)}</div>
        <div class="levels">${["À renforcer","En cours","À consolider","Maîtrisé"].map(v=>`<button class="${val===v?"selected ":""}level-${levelScore(v)}" onclick="setLevel('${key}','${v}')">${v}</button>`).join("")}</div></div>`;
    }).join("");
  }
  const groups={};
  c.criteria.forEach((crit,i)=>(groups[crit.group]??=[]).push({...crit,i}));
  return Object.entries(groups).map(([g,items])=>`
    <div class="c11-group">
      <div class="c11-group-title">${g} — ${esc(items[0].label)}</div>
      ${items.map(crit=>{
        const key=c.id+"-"+crit.i, val=draft.levels[key]||"Non observé";
        return `<div class="c11-criterion">
          <div class="c11-criterion-text"><b>${crit.i+1}.</b> ${esc(crit.text)}</div>
          <div class="levels">${["À renforcer","En cours","À consolider","Maîtrisé"].map(v=>`<button class="${val===v?"selected ":""}level-${levelScore(v)}" onclick="setLevel('${key}','${v}')">${v}</button>`).join("")}</div>
        </div>`;
      }).join("")}
    </div>`).join("");
}
